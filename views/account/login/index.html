<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - ToolBox</title>

    <link rel="icon" type="image/x-icon" href="/img/logo/Logo 180.png">
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <link rel="stylesheet" href="/css/login.css">
    <link rel="stylesheet" href="/css/loader.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;700&display=swap" rel="stylesheet">
</head>
<body class="bg-white"> <!-- Fondo blanco -->

    <!-- Loader -->
<div id="loader" class="d-none loader-overlay">
    <div class="spinner-border" role="status">
        <span class="visually-hidden">Cargando...</span>
    </div>
</div> 

    <section class="vh-100 d-flex flex-column">
        <div class="container py-5 h-100">
            <div class="row justify-content-center align-items-center h-100">
                <div class="col-12 col-md-8 col-lg-6 col-xl-5">
                    <div class="logo text-center mb-4">
                        <a href="#" id="homeBtn"><img src="/img/logo/LogoLetra.png" alt="Logo" style="max-width: 50%;"></a>
                    </div>
                    <div class="card text-white shadow" style="border-radius: 1rem; background-color: #5e3b3b;">
                        <div class="card-body p-5 text-center">
                            <h2 class="fw-bold mb-4 text-uppercase">Iniciar Sesión</h2>
                            <p class="text-white-50 mb-5">Ingrese su nombre de usuario y contraseña</p>
      
                            <form id="loginForm">
                                <div class="form-outline form-white mb-4">
                                    <input type="text" id="usuario" class="form-control form-control-lg" placeholder="Usuario" name="usuario">
                                </div>
                                <div class="form-outline form-white mb-4">
                                    <input type="password" id="password" class="form-control form-control-lg" placeholder="Contraseña" name="contraseña">
                                </div>
                                <p class="notification"></p>
                                <button type="submit" class="btn btn-outline-light btn-lg px-5" id="loginBtn">Login</button>
                            </form>

                            <p class="small mt-4"><a href="#" class="text-light claveOlvidada" id="olvidada">Olvidé la contraseña</a></p>
                            <div class="d-flex justify-content-center mt-4">
                                <a href="#" class="text-light me-3"><i class="fab fa-facebook-f fa-lg"></i></a>
                                <a href="#" class="text-light me-3"><i class="fab fa-twitter fa-lg"></i></a>
                                <a href="#" class="text-light"><i class="fab fa-google fa-lg"></i></a>
                            </div>
                            <p class="mt-4">¿No tienes cuenta? <a href="#" class="text-light fw-bold" id="create">Crea una!</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <footer class="mt-auto py-3 bg-dark text-light">
            <div class="container text-center">
                <a href="/acerca-de" class="text-light">Sobre nosotros</a>
                <p class="mb-0">© 2024 ToolBox. Todos los derechos reservados.</p>
            </div>
        </footer>
    </section>

    <script src="/js/login.js"></script>
</body>
</html>
